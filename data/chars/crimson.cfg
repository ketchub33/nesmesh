; =====================================================================
;  АКАНЕ — все цифры бойца.
;  Правишь, сохраняешь (Ctrl+S) — игра сама перечитает файл за полсекунды
;  (в тренировке или с режимом разработчика F1). Вручную — F6.
;  Строки, начинающиеся с «;», — комментарии, игра их не читает.
; =====================================================================

[char]
name="Акане"
col="e0245e"          ; основной цвет (эффекты, кубик)
dark="3a2430"         ; тёмный цвет
vfx="crimson"          ; набор эффектов из assets/vfx/
portrait="res://assets/characters/crimson/portrait.png"
face=Rect2(235, 70, 200, 200)   ; где на портрете лицо: x, y, ширина, высота

[stats]
speed=6.4       ; скорость бега
air=5.8         ; скорость в воздухе
jump=14.5       ; сила прыжка с земли
djump=13.0      ; сила прыжка в воздухе
jumps=2         ; прыжков в воздухе (плюс один с земли)
weight=1.05     ; вес: больше — меньше отлетает
power=1.08      ; множитель силы всех ударов
fall=13.0       ; скорость быстрого падения
recover=17.0    ; сила подброса у восстановления (тяжёлая вверх в воздухе)

[sprite]
fw=255                  ; ширина одного кадра в картинке
fh=236                  ; высота кадра
anchor=Vector2(146, 212) ; точка между ног внутри кадра
scale=0.6               ; масштаб спрайта в игре
smooth=true             ; сглаживание (false — для пиксель-арта)

[anims]
; имя = [файл, кадров, кадров в секунду, номер кадра удара (с нуля)]
idle=["res://assets/characters/crimson/idle.png", 6, 8.0, 0]
run=["res://assets/characters/crimson/run.png", 6, 12.0, 0]
jump=["res://assets/characters/crimson/jump.png", 2, 6.0, 0]
fall=["res://assets/characters/crimson/fall.png", 2, 6.0, 0]
dodge=["res://assets/characters/crimson/dodge.png", 3, 0.0, 0]
attack=["res://assets/characters/crimson/attack.png", 4, 0.0, 2]
attack2=["res://assets/characters/crimson/attack2.png", 5, 0.0, 1]
hit=["res://assets/characters/crimson/hit.png", 3, 8.0, 0]

; =====================================================================
;  ПРИЁМЫ. Время — в кадрах (60 кадров = 1 секунда).
;   s   — разгон (замах до удара)
;   a   — активные кадры (когда удар бьёт)
;   e   — восстановление (после удара, боец беззащитен)
;   dmg — урон
;   kb  — базовый отлёт
;   sc  — рост отлёта от накопленного урона (главное для добивания)
;   ang — угол отлёта в градусах: 0 — вперёд, 90 — вверх, -60 — вниз-вперёд
;   box — хитбокс: Rect2(x, y, ширина, высота) от ног бойца;
;         x вперёд по взгляду, y вверх — отрицательный (−76 — макушка)
;   charge=true — можно заряжать, держа кнопку
; =====================================================================

